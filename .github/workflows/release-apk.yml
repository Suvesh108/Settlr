name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter
        run: flutter --version

      - name: Generate Android Platform for mobile/
        working-directory: mobile
        run: |
          flutter create --platforms=android . 2>&1
          echo "=== Android scaffold done ==="
          ls android/

      - name: Install Dependencies
        working-directory: mobile
        run: |
          flutter pub get 2>&1
          echo "=== pub get done ==="

      - name: Patch main.dart - remove Inter fontFamily
        working-directory: mobile
        run: |
          sed -i "s/fontFamily: 'Inter',/\/\/ fontFamily: 'Inter', \/\/ patched for CI/g" lib/main.dart
          echo "=== Patched main.dart ==="
          grep -n "fontFamily\|Inter" lib/main.dart || true

      - name: Analyze Dart Code
        working-directory: mobile
        run: |
          flutter analyze --no-fatal-infos 2>&1
          echo "=== flutter analyze exit: $? ==="

      - name: Build Release APK
        working-directory: mobile
        run: |
          flutter build apk --release --no-tree-shake-icons --verbose 2>&1

      - name: Locate and rename APK
        run: |
          find mobile/build -name "*.apk" 2>/dev/null
          cp mobile/build/app/outputs/flutter-apk/app-release.apk settlr-v0.0.1.apk
          echo "APK size: $(du -sh settlr-v0.0.1.apk)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v0.0.1' }}
          name: Settlr Android v${{ github.ref_name || '0.0.1' }}
          draft: false
          prerelease: false
          body: |
            ## 📱 Settlr Mobile — Native Android App (v0.0.1)

            ### Highlights:
            * **Continuous Debt Netting**: Bilateral calculation engine balances debts automatically.
            * **Background Bank SMS Detection**: Intercepts UPI, Netbanking, and Debit card notifications.
            * **Local-First & Multi-Currency**: Offline-first session with INR, USD, EUR, and GBP.
            * **Private Solitary Ledger**: Tracks personal spending separately from shared groups.

            ### Installation:
            Download `settlr-v0.0.1.apk` and install directly on your Android device.
          files: |
            settlr-v0.0.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
