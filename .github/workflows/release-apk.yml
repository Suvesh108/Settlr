name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version info
        run: |
          flutter --version
          dart --version

      - name: Generate Android Platform
        working-directory: mobile
        run: |
          flutter create --org com.settlr --platforms=android . 2>&1
          echo "=== Android scaffold exit: $? ==="

      - name: Patch Android Platform (Icons, Permissions, FileProvider, Native Updater)
        working-directory: mobile
        run: |
          python scripts/patch_android.py
          echo "=== Android patch exit: $? ==="

      - name: Flutter pub get
        working-directory: mobile
        run: |
          flutter pub get 2>&1

      - name: Build Release APK
        working-directory: mobile
        run: |
          TAG_VER="${{ github.ref_name }}"
          CLEAN_VER="${TAG_VER#v}"
          BUILD_NUM="${{ github.run_number }}"
          echo "Building release APK for version: ${CLEAN_VER} with build number: ${BUILD_NUM}"
          flutter build apk --release --no-tree-shake-icons --build-name="${CLEAN_VER}" --build-number="${BUILD_NUM}"

      - name: Copy APK Asset
        run: |
          VERSION="${{ github.ref_name }}"
          cp mobile/build/app/outputs/flutter-apk/app-release.apk "settlr-${VERSION}.apk"
          echo "Generated APK: settlr-${VERSION}.apk"
          ls -lh *.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Settlr Android Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ## 📱 Settlr Mobile — Native Android App (${{ github.ref_name }})

            ### What's New in v0.0.7:
            * **Encrypted Cloud Backend**: Securely encrypted production Render backend endpoint (`https://settlr-006k.onrender.com`) via runtime byte masking to prevent reverse engineering and strings extraction.
            * **Webapp Smart Spend Parity**: Complete visual & behavioral parity with webapp (Group vs. Personal allocation switch, merchant auto-categorization, split calculations, and auto-tab switching).
            * **Fixed SMS Loop & Past Bills**: Eliminated repeated popup loop and prevented detection of past bills from yesterday; enforced strict 120-second freshness window and persistent SMS hash deduplication.
            * **Real-time Cross-Network Sync**: Friends across different cities/networks (e.g. Bihar & Bangalore) now sync group expenses and balances in real time over Render WebSockets.

            ### Installation:
            Download and install `settlr-${{ github.ref_name }}.apk` directly on your Android device.
            *(Note: If migrating from older v0.0.4 builds, uninstall the previous version once to migrate to the permanent official signing key)*.
          files: |
            settlr-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

