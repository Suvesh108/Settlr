name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version info
        run: |
          flutter --version
          dart --version

      - name: Generate Android Platform
        working-directory: mobile
        run: |
          flutter create --platforms=android . 2>&1
          echo "=== Android scaffold exit: $? ==="

      - name: Show pubspec after scaffold
        working-directory: mobile
        run: cat pubspec.yaml

      - name: Flutter pub get
        working-directory: mobile
        run: |
          flutter pub get 2>&1

      - name: Show pub outdated / lock
        working-directory: mobile
        run: |
          cat pubspec.lock | head -80

      - name: Build Release APK
        working-directory: mobile
        run: |
          flutter build apk --release --no-tree-shake-icons

      - name: Copy APK
        run: |
          find mobile/build -name "*.apk" 2>/dev/null
          cp mobile/build/app/outputs/flutter-apk/app-release.apk settlr-v0.0.1.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v0.0.1' }}
          name: Settlr Android Release v0.0.1
          draft: false
          prerelease: false
          body: |
            ## 📱 Settlr Mobile — Native Android App (v0.0.1)

            * **Continuous Debt Netting** — bilateral pairwise calculation engine
            * **Local-First & Multi-Currency** — INR, USD, EUR, GBP offline-first
            * **Private Solitary Ledger** — personal spending off shared groups

            Install `settlr-v0.0.1.apk` directly on your Android device.
          files: |
            settlr-v0.0.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
