name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold Official Flutter Android Project
        run: |
          # Create a clean fresh Flutter project with official modern Gradle 8 & AGP configuration
          flutter create settlr_app --org com.settlr --project-name settlr_mobile --platforms android
          # Copy our customized mobile code and pubspec into the scaffolded app
          cp -r mobile/lib settlr_app/
          cp mobile/pubspec.yaml settlr_app/pubspec.yaml
          cd settlr_app
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Rename APK Asset
        run: |
          cp settlr_app/build/app/outputs/flutter-apk/app-release.apk settlr-v0.0.1.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v0.0.1' }}
          name: Settlr Android Release ${{ github.ref_name || 'v0.0.1' }}
          draft: false
          prerelease: false
          body: |
            ## 📱 Settlr Mobile — Native Android App (v0.0.1)

            ### Highlights:
            * **Continuous Debt Netting**: Bilateral calculation engine balances debts automatically.
            * **Background Bank SMS Detection**: Intercepts UPI, Netbanking, and Debit card notifications.
            * **Local-First & Multi-Currency**: Offline-first session with INR, USD, EUR, and GBP.
            * **Private Solitary Ledger**: Seamlessly tracks personal spending separate from shared roommate groups.

            ### Installation:
            Download and install `settlr-v0.0.1.apk` directly onto your Android device.
          files: |
            settlr-v0.0.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
