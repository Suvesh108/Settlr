name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version info
        run: |
          flutter --version
          dart --version

      - name: Generate Android Platform
        working-directory: mobile
        run: |
          flutter create --org com.settlr --platforms=android . 2>&1
          echo "=== Android scaffold exit: $? ==="

      - name: Patch Android Platform (Icons, Permissions, FileProvider, Native Updater)
        working-directory: mobile
        run: |
          python scripts/patch_android.py
          echo "=== Android patch exit: $? ==="

      - name: Flutter pub get
        working-directory: mobile
        run: |
          flutter pub get 2>&1

      - name: Build Release APK
        working-directory: mobile
        run: |
          flutter build apk --release --no-tree-shake-icons

      - name: Copy APK Asset
        run: |
          VERSION="${{ github.ref_name || 'v0.0.2' }}"
          cp mobile/build/app/outputs/flutter-apk/app-release.apk "settlr-${VERSION}.apk"
          echo "Generated APK: settlr-${VERSION}.apk"
          ls -lh *.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v0.0.4' }}
          name: Settlr Android Release ${{ github.ref_name || 'v0.0.4' }}
          draft: false
          prerelease: false
          body: |
            ## 📱 Settlr Mobile — Native Android App (${{ github.ref_name || 'v0.0.4' }})

            ### What's New:
            * **Zero-Delay Startup**: Instant cache-first launch eliminating blocking loading spinners on every app open.
            * **Keyboard Overflow Protection**: Full `SafeArea` and scroll protection against keyboard `RenderFlex` overflows in all modal sheets.
            * **Live Reactive Split Previews**: Real-time per-member calculation while typing with exact paise penny conservation across Exact, Percentage, and Shares.
            * **Full Offline Bilateral Netting**: Complete local computation of bilateral pairwise debt matrix and settlements matching the Go engine.
            * **Wi-Fi Server Config**: In-app backend switcher in Profile to easily connect real devices to local network IPs.
            * **Hardened Type Safety**: Null-safe and double/int defensive casting across all models.

            ### Installation:
            Download and install `settlr-${{ github.ref_name || 'v0.0.4' }}.apk` directly on your Android device.
          files: |
            settlr-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
