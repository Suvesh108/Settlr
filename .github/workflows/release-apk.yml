name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version info
        run: |
          flutter --version
          dart --version

      - name: Generate Android Platform
        working-directory: mobile
        run: |
          flutter create --org com.settlr --platforms=android . 2>&1
          echo "=== Android scaffold exit: $? ==="

      - name: Patch Android Platform (Icons, Permissions, FileProvider, Native Updater)
        working-directory: mobile
        run: |
          python scripts/patch_android.py
          echo "=== Android patch exit: $? ==="

      - name: Flutter pub get
        working-directory: mobile
        run: |
          flutter pub get 2>&1

      - name: Build Release APK
        working-directory: mobile
        run: |
          TAG_VER="${{ github.ref_name || 'v0.0.5' }}"
          BUILD_NUM="${{ github.run_number || '5' }}"
          CLEAN_VER="${TAG_VER#v}"
          echo "Building release APK for version: ${CLEAN_VER} with build number: ${BUILD_NUM}"
          flutter build apk --release --no-tree-shake-icons --build-name="${CLEAN_VER}" --build-number="${BUILD_NUM}"

      - name: Copy APK Asset
        run: |
          VERSION="${{ github.ref_name || 'v0.0.5' }}"
          cp mobile/build/app/outputs/flutter-apk/app-release.apk "settlr-${VERSION}.apk"
          echo "Generated APK: settlr-${VERSION}.apk"
          ls -lh *.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v0.0.5' }}
          name: Settlr Android Release ${{ github.ref_name || 'v0.0.5' }}
          draft: false
          prerelease: false
          body: |
            ## 📱 Settlr Mobile — Native Android App (${{ github.ref_name || 'v0.0.5' }})

            ### What's New:
            * **Permanent Keystore Signing**: Fixed update conflict by signing with deterministic release keystore so subsequent in-app updates upgrade seamlessly.
            * **Complete Webapp Motion Parity**: Replicated all Framer Motion spring physics (`ease: [0.16, 1, 0.3, 1]`), fluid sliding pill indicators, bouncy tap scaling, and modal spring sheets.
            * **Haptic Dock & Gliding Tabs**: Fluid bottom dock with spring active pill indicator and glowing Floating Action Button.
            * **Celebration Confetti Engine**: Native particle explosion upon completing settlements.
            * **Modular Architecture**: 1:1 parity with the webapp design system and components.

            ### Installation:
            Download and install `settlr-${{ github.ref_name || 'v0.0.5' }}.apk` directly on your Android device.
            *(Note: If migrating from older v0.0.4 builds, uninstall the previous version once to migrate to the permanent official signing key)*.
          files: |
            settlr-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
