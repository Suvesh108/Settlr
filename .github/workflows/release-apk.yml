name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter
        run: flutter --version

      - name: Scaffold Fresh Flutter Android Project
        run: |
          flutter create settlr_app \
            --org com.settlr \
            --project-name settlr_mobile \
            --platforms=android
          echo "=== Scaffold done ==="

      - name: Install Dependencies
        working-directory: settlr_app
        run: |
          flutter pub add http shared_preferences intl uuid
          echo "=== pub add done ==="
          flutter pub get
          echo "=== pub get done ==="

      - name: Copy App Source
        run: |
          rm -rf settlr_app/lib
          cp -r mobile/lib settlr_app/lib
          echo "=== Source copy done ==="
          ls settlr_app/lib

      - name: Remove google_fonts from source (replaced with system font)
        run: |
          # Replace fontFamily: 'Inter' with nothing (let Flutter use default)
          sed -i "s/fontFamily: 'Inter',/\/\/ fontFamily removed for CI build/g" settlr_app/lib/main.dart
          echo "=== main.dart after patch ==="
          cat settlr_app/lib/main.dart

      - name: Analyze Dart Code
        working-directory: settlr_app
        run: |
          flutter analyze --no-fatal-infos
          echo "=== Analyze done ==="

      - name: Build Release APK
        working-directory: settlr_app
        run: |
          flutter build apk --release --no-tree-shake-icons --verbose

      - name: Locate APK
        run: |
          find settlr_app/build -name "*.apk" 2>/dev/null || echo "No APK found"
          cp settlr_app/build/app/outputs/flutter-apk/app-release.apk settlr-v0.0.1.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v0.0.1' }}
          name: Settlr Android Release ${{ github.ref_name || 'v0.0.1' }}
          draft: false
          prerelease: false
          body: |
            ## 📱 Settlr Mobile — Native Android App (v0.0.1)

            ### Highlights:
            * **Continuous Debt Netting**: Bilateral calculation engine balances debts automatically.
            * **Background Bank SMS Detection**: Intercepts UPI, Netbanking, and Debit card notifications.
            * **Local-First & Multi-Currency**: Offline-first session with INR, USD, EUR, and GBP.
            * **Private Solitary Ledger**: Tracks personal spending separately from shared groups.

            ### Installation:
            Download `settlr-v0.0.1.apk` and install directly on your Android device.
          files: |
            settlr-v0.0.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
