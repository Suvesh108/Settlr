name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version info
        run: |
          flutter --version
          dart --version

      - name: Generate Android Platform
        working-directory: mobile
        run: |
          flutter create --org com.settlr --platforms=android . 2>&1
          echo "=== Android scaffold exit: $? ==="

      - name: Patch Android Platform (Icons, Permissions, FileProvider, Native Updater)
        working-directory: mobile
        run: |
          python scripts/patch_android.py
          echo "=== Android patch exit: $? ==="

      - name: Flutter pub get
        working-directory: mobile
        run: |
          flutter pub get 2>&1

      - name: Build Release APK
        working-directory: mobile
        run: |
          TAG_VER="${{ github.ref_name }}"
          CLEAN_VER="${TAG_VER#v}"
          BUILD_NUM="${{ github.run_number }}"
          echo "Building release APK for version: ${CLEAN_VER} with build number: ${BUILD_NUM}"
          flutter build apk --release --no-tree-shake-icons --build-name="${CLEAN_VER}" --build-number="${BUILD_NUM}"

      - name: Copy APK Asset
        run: |
          VERSION="${{ github.ref_name }}"
          cp mobile/build/app/outputs/flutter-apk/app-release.apk "settlr-${VERSION}.apk"
          echo "Generated APK: settlr-${VERSION}.apk"
          ls -lh *.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Settlr Android Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ## 📱 Settlr Mobile — Native Android App (${{ github.ref_name }})

            ### What's New in ${{ github.ref_name }}:
            * **Smart Receipt Itemizer**: Dish & item-level expense splitting with proportional tax and tip redistribution.
            * **Spending Analytics & Insights**: Category burn rate breakdowns, 7D/30D/All horizon filters, and top spender rankings.
            * **Audit-Ready Data Export**: Instant UTF-8 BOM CSV export for Excel/Sheets, JSON ledger snapshots, and clean print styles.
            * **Dynamic UPI Settlement Engine**: Dynamic QR code generation (`upi://pay`), customizable VPA memory, mobile app links, and 1-tap settlement marking.
            * **Backend Reliability & Security**: Resolved auth panic on `GetMe`, fixed `Register` mutex race conditions, eliminated syncbox 403 in PG mode, and enforced empty array serialization (`make([]T, 0)`).
            * **Reactive UX**: Replaced full-page reloads with TanStack Query invalidation; added debtor settlement cancellation and recipient payment rejection.

            ### Installation:
            Download and install `settlr-${{ github.ref_name }}.apk` directly on your Android device.
          files: |
            settlr-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

