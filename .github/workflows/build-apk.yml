name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'

      - name: Re-create Clean Flutter Android Scaffold
        working-directory: mobile
        run: |
          # Preserve our custom dart and manifest code
          mkdir -p /tmp/settlr_backup
          cp -r lib /tmp/settlr_backup/
          cp android/app/src/main/AndroidManifest.xml /tmp/settlr_backup/ || true

          # Create fresh standard Flutter project config
          flutter create --org com.settlr --project-name settlr_mobile .

          # Restore our custom code
          cp -r /tmp/settlr_backup/lib/* lib/
          cp /tmp/settlr_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

          flutter pub get

      - name: Build APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Settlr-v1.0.0.apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: Settlr Mobile Android v${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
